name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/first-playable-dungeon
      - codex/dungeon-campaign
    paths:
      - '**.py'
      - '**.ps1'
      - requirements-build.txt
      - CREDITS.txt
      - legal/**
      - .github/workflows/windows-exe.yml

permissions:
  contents: read

jobs:
  windows-exe:
    name: Build and test Windows executable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Run the game tests
        run: python -m unittest discover -v

      - name: Build the desktop and terminal executables
        run: python scripts/build_windows.py

      - name: Verify personal signing with temporary test certificates
        timeout-minutes: 3
        shell: powershell
        run: .\scripts\test_personal_signing.ps1 -ExecutablePath .\dist\CatacombsOfThalinor-Terminal.exe

      - name: Play a complete adventure through the executable
        run: python scripts/smoke_executable.py dist/CatacombsOfThalinor-Terminal.exe

      - name: Exercise the desktop screens and controls through the executable
        run: python scripts/smoke_gui.py dist/CatacombsOfThalinor.exe

      - name: Upload the Windows download
        uses: actions/upload-artifact@v4
        with:
          name: CatacombsOfThalinor-Windows-x64
          path: |
            dist/CatacombsOfThalinor.exe
            dist/CatacombsOfThalinor-Terminal.exe
            dist/CREDITS.txt
            dist/legal/
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 30
